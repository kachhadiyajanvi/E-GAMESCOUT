<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | E-Game Scout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Rajdhani', 'sans-serif'], display: ['Orbitron', 'sans-serif'] },
                    colors: { 'brand-dark': '#0B0C10', 'brand-gray': '#1F2833', 'brand-light': '#C5C6C7', 'accent-cyan': '#66FCF1' }
                }
            }
        }
    </script>
</head>

<body class="bg-brand-dark text-white font-sans overflow-x-hidden">

    <!-- Navbar -->
    <nav
        class="w-full py-4 px-6 md:px-12 flex items-center justify-between border-b border-white/10 bg-brand-dark/95 backdrop-blur z-50 sticky top-0">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-bolt text-accent-cyan text-xl"></i>
            <span class="text-xl font-display font-bold tracking-wider text-white">DASHBOARD</span>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-brand-light text-sm hidden md:inline">{{ player.full_name }}</span>
            <a href="{% url 'auth_logout' %}"
                class="px-4 py-2 border border-red-500/50 text-red-500 rounded hover:bg-red-500 hover:text-white transition-colors text-xs font-bold uppercase">
                Logout
            </a>
        </div>
    </nav>

    <div class="container mx-auto px-6 py-12">
        <!-- Greetings -->
        <div class="mb-12">
            <h1 class="text-4xl font-display font-bold mb-2">WELCOME BACK, <span
                    class="text-accent-cyan">{{player.full_name }}</span></h1>
            <p class="text-gray-400">UID: <span class="font-mono text-white">{{ player.uid }}</span> | Status: <span
                    class="text-green-400">{{ player.status }}</span></p>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div
                class="bg-brand-gray/20 border border-white/10 p-6 rounded-xl hover:border-accent-cyan/50 transition-colors">
                <div class="text-gray-400 text-xs uppercase tracking-widest mb-2">Tournaments Joined</div>
                <div class="text-3xl font-display font-bold">0</div>
            </div>
            <div
                class="bg-brand-gray/20 border border-white/10 p-6 rounded-xl hover:border-accent-cyan/50 transition-colors">
                <div class="text-gray-400 text-xs uppercase tracking-widest mb-2">Matches Won</div>
                <div class="text-3xl font-display font-bold text-accent-cyan">0</div>
            </div>
            <div
                class="bg-brand-gray/20 border border-white/10 p-6 rounded-xl hover:border-accent-cyan/50 transition-colors">
                <div class="text-gray-400 text-xs uppercase tracking-widest mb-2">Credits</div>
                <div class="text-3xl font-display font-bold">0.00</div>
            </div>
        </div>

        <!-- Content Area -->
        <div
            class="bg-brand-gray/10 border border-white/5 rounded-2xl p-8 text-center min-h-[300px] flex flex-col items-center justify-center">
            <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center text-gray-500 mb-4">
                <i class="fa-solid fa-gamepad text-2xl"></i>
            </div>
            <h3 class="text-xl font-bold mb-2">No Active Tournaments</h3>
            <p class="text-gray-400 max-w-md">You haven't joined any tournaments yet. Check out the tournament lobby to
                start competing.</p>
            <button
                class="mt-6 px-6 py-3 bg-white/5 border border-white/20 rounded-lg hover:bg-accent-cyan hover:text-brand-dark transition-all font-bold text-sm">
                Browse Tournaments
            </button>
        </div>
    </div>

</body>

</html>
