<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>E-Game Scout Verification</title>
</head>

<body style="margin: 0; padding: 0; background-color: #0B0C10; font-family: 'Arial', sans-serif;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table border="0" cellpadding="0" cellspacing="0" width="600"
                    style="border-collapse: collapse; background-color: #1F2833; border: 1px solid #333; border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(102, 252, 241, 0.1);">

                    <!-- Header -->
                    <tr>
                        <td align="center"
                            style="padding: 30px; background-color: #0B0C10; border-bottom: 2px solid #66FCF1;">
                            <h1
                                style="color: #FFFFFF; font-family: 'Arial Black', sans-serif; font-size: 24px; margin: 0; letter-spacing: 2px;">
                                E-GAME <span style="color: #66FCF1;">SCOUT</span>
                            </h1>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td align="center" style="padding: 40px 30px;">
                            <h2 style="color: #FFFFFF; font-size: 20px; margin-bottom: 20px;">PLAYER ACCESS CODE</h2>
                            <p style="color: #C5C6C7; font-size: 16px; line-height: 24px; margin-bottom: 30px;">
                                Use the secure code below to verify your identity and access your dashboard.
                            </p>

                            <!-- ORP Box -->
                            <div
                                style="background-color: #0B0C10; border: 1px solid #66FCF1; padding: 20px; text-align: center; border-radius: 4px; display: inline-block; min-width: 200px;">
                                <span
                                    style="font-family: 'Courier New', monospace; font-size: 32px; font-weight: bold; color: #66FCF1; letter-spacing: 5px;">
                                    {{ otp_code }}
                                </span>
                            </div>

                            <p style="color: #66FCF1; font-size: 14px; margin-top: 30px;">
                                This code will expire in 10 minutes.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center"
                            style="padding: 20px; background-color: #0B0C10; border-top: 1px solid #333;">
                            <p style="color: #555; font-size: 12px; margin: 0;">
                                &copy; 2026 E-Game Scout. Secure Transmission.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
