<!DOCTYPE html>
<html>

<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;600&display=swap');
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #0B0C10; font-family: 'Rajdhani', Arial, sans-serif;">
    <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #0B0C10;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table width="600" border="0" cellspacing="0" cellpadding="0"
                    style="background-color: #1F2833; border: 1px solid #333; border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(102, 252, 241, 0.1);">
                    <!-- Header -->
                    <tr>
                        <td align="center"
                            style="padding: 30px; background-color: #0B0C10; border-bottom: 2px solid #66FCF1;">
                            <h1
                                style="margin: 0; color: #ffffff; font-family: 'Orbitron', Arial, sans-serif; font-size: 24px; letter-spacing: 2px;">
                                E-GAME <span style="color: #66FCF1;">SCOUT</span>
                            </h1>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td align="center" style="padding: 40px 30px;">
                            <h2
                                style="margin: 0 0 20px 0; color: #C5C6C7; font-size: 20px; text-transform: uppercase; letter-spacing: 1px;">
                                Authentication Request</h2>
                            <p style="margin: 0 0 30px 0; color: #8892b0; font-size: 16px; line-height: 1.5;">
                                Use the following One-Time Password (OTP) to complete your login or registration. Do not
                                share this code with anyone.
                            </p>

                            <!-- OTP Box -->
                            <div
                                style="background-color: #0B0C10; border: 1px solid #45A29E; border-radius: 4px; padding: 15px 30px; display: inline-block; margin-bottom: 30px;">
                                <span
                                    style="color: #66FCF1; font-family: 'Orbitron', monospace; font-size: 32px; letter-spacing: 8px; font-weight: bold;">
                                    {{ otp }}
                                </span>
                            </div>

                            <p style="margin: 0; color: #666; font-size: 12px;">
                                If you did not request this code, please ignore this email.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center"
                            style="padding: 20px; background-color: #050608; border-top: 1px solid #333;">
                            <p style="margin: 0; color: #45A29E; font-size: 12px;">© 2026 E-Game Scout. Secure
                                Transmission.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
