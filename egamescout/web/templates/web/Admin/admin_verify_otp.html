<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGAME SCOUT | VERIFY OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-panel {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 243, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 243, 255, 0.05);
        }

        .input-glow:focus-within {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
            border-color: rgba(0, 243, 255, 0.4);
        }

        .bg-grid {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(0, 243, 255, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.06) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 10%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 80%);
        }

        /* Override Browser Autofill Styles */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #050505 inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                    },
                    colors: {
                        'brand-blue': '#00f3ff',     /* Neon Cyan */
                        'brand-dark': '#050505',     /* Pitch Black */
                    }
                }
            }
        }
    </script>
    {% load static %}
</head>

<body class="bg-brand-dark min-h-screen flex items-center justify-center p-4 font-sans relative overflow-hidden">

    <!-- Glowing Cyber Grid Background -->
    <div class="fixed inset-0 z-0 bg-grid pointer-events-none"></div>

    <!-- Soft central cyan glow -->
    <div
        class="fixed top-1/2 left-1/2 w-[700px] h-[700px] bg-brand-blue/5 rounded-full blur-[120px] pointer-events-none -translate-x-1/2 -translate-y-1/2">
    </div>

    <!-- Main Card Container -->
    <div class="relative z-10 w-full max-w-[400px] glass-panel rounded-2xl p-10 flex flex-col items-center">

        <!-- Logo/Header -->
        <div class="w-full flex flex-col items-center justify-center mb-8">
            <div
                class="w-16 h-16 rounded-xl bg-black flex items-center justify-center shadow-[0_0_15px_rgba(0,243,255,0.1)] relative z-10 border border-brand-blue/20 mb-4">
                <i class="fa-solid fa-shield-halved text-brand-blue text-2xl drop-shadow-[0_0_8px_rgba(0,243,255,0.6)]"></i>
            </div>

            <div class="text-center w-full">
                <h1 class="font-display font-black text-xl tracking-[0.1em] mb-1">
                    <span class="text-white">SECURITY</span> <span class="text-brand-blue">CHECK</span>
                </h1>
                <p class="text-[13px] text-white/50 tracking-wide mt-2">Enter the 6-digit verification code sent to your email.</p>
            </div>
        </div>

        <!-- Form -->
        <form method="post" class="space-y-6 w-full relative z-20">
            {% csrf_token %}

            <!-- OTP Input -->
            <div class="relative group input-glow rounded-lg transition-all duration-300">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-key text-white/30 group-focus-within:text-brand-blue transition-colors text-sm"></i>
                </div>
                <!-- 
                    Using type="text" and inputmode="numeric" provides the correct keyboard on mobile,
                    while allowing us to style it nicely without increment arrows that type="number" introduces.
                -->
                <input type="text" inputmode="numeric" pattern="[0-9]{6}" name="otp" maxlength="6"
                    class="w-full bg-theme-bg/80 border border-white/10 rounded-lg pl-11 pr-4 py-4 text-center text-brand-blue font-display text-2xl tracking-[0.5em] focus:outline-none placeholder-transparent peer"
                    placeholder="000000" required autocomplete="one-time-code">
                <label
                    class="absolute left-1/2 -translate-x-1/2 top-4 text-white/40 text-[13px] font-medium transition-all peer-focus:-translate-y-7 peer-focus:text-[10px] peer-focus:text-brand-blue peer-focus:tracking-widest peer-focus:bg-brand-dark peer-focus:px-2 peer-focus:rounded peer-[:not(:placeholder-shown)]:-translate-y-7 peer-[:not(:placeholder-shown)]:text-[10px] peer-[:not(:placeholder-shown)]:text-gray-400 peer-[:not(:placeholder-shown)]:bg-brand-dark peer-[:not(:placeholder-shown)]:px-2 peer-[:not(:placeholder-shown)]:tracking-widest pointer-events-none uppercase">
                    Verification Code
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="verifyBtn"
                class="w-full relative overflow-hidden rounded-lg bg-brand-blue/10 border border-brand-blue/30 group/btn transition-all duration-300 hover:bg-brand-blue/20 hover:border-brand-blue hover:shadow-[0_0_20px_rgba(0,243,255,0.2)]">
                <div class="py-3.5 px-6 flex items-center justify-center gap-3">
                    <span
                        class="font-display font-semibold uppercase tracking-[0.15em] text-sm text-brand-blue transition-colors">VERIFY IDENTITY</span>
                    <i
                        class="fa-solid fa-fingerprint text-brand-blue text-sm transition-transform group-hover/btn:scale-110"></i>
                </div>
            </button>
            
            <!-- Timer & Actions -->
            <div class="flex flex-col items-center justify-center gap-2 pt-2">
                <div id="timerContainer" class="text-white/60 text-xs tracking-wider flex items-center gap-1.5 font-mono">
                    <i class="fa-regular fa-clock text-accent-cyan"></i> 
                    Expires in: <span id="countdown" class="font-bold text-accent-cyan">--:--</span>
                </div>
                
                <div id="resendContainer" class="hidden">
                    <a href="{% url 'admin_resend_otp' %}" class="text-[12px] font-bold text-brand-blue hover:text-white uppercase tracking-widest transition-colors flex items-center gap-1.5 px-4 py-2 rounded bg-brand-blue/5 hover:bg-brand-blue/20 border border-brand-blue/20">
                        <i class="fa-solid fa-rotate-right"></i> Resend OTP
                    </a>
                </div>

                <a href="{% url 'admin_login' %}" class="text-[11px] text-white/40 hover:text-brand-blue uppercase tracking-widest transition-colors mt-2">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Return to Login
                </a>
            </div>
        </form>

    </div>

    <!-- Toast Notification System -->
    <div id="toast-container" class="fixed top-8 right-8 z-[100] flex flex-col gap-4 pointer-events-none"></div>

    <script>
        // Countdown Timer Logic
        let timeLeft = parseInt('{{ remaining_time|default:"0" }}');
        const countdownEl = document.getElementById('countdown');
        const timerContainer = document.getElementById('timerContainer');
        const resendContainer = document.getElementById('resendContainer');
        const verifyBtn = document.getElementById('verifyBtn');
        const otpInput = document.querySelector('input[name="otp"]');

        function updateTimer() {
            if (timeLeft <= 0) {
                countdownEl.textContent = '00:00';
                timerContainer.classList.add('text-red-500');
                countdownEl.classList.replace('text-accent-cyan', 'text-red-500');
                countdownEl.parentElement.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-500"></i> OTP EXPIRED';
                
                // Show Resend button, Disable verify
                resendContainer.classList.remove('hidden');
                verifyBtn.disabled = true;
                verifyBtn.classList.add('opacity-50', 'cursor-not-allowed', 'grayscale');
                otpInput.disabled = true;
                otpInput.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            countdownEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            timeLeft--;
            setTimeout(updateTimer, 1000);
        }

        if (timeLeft > 0) {
            updateTimer();
        } else {
            timeLeft = 0;
            updateTimer();
        }

        // Toast Notifications
        function showToast(message, tags) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let iconClass = 'fa-info-circle';
            let iconColorClass = 'text-brand-blue bg-brand-blue/10 border-brand-blue/30';

            if (tags.includes('error') || tags.includes('warning')) {
                iconClass = 'fa-triangle-exclamation';
                iconColorClass = 'text-red-500 bg-red-500/10 border-red-500/30';
            } else if (tags.includes('success')) {
                iconClass = 'fa-check';
                iconColorClass = 'text-green-400 bg-green-400/10 border-green-400/30';
            }

            toast.className = `pointer-events-auto bg-[#ffffff] dark:bg-[#111827] border border-gray-200 dark:border-gray-800 rounded-[16px] p-5 shadow-2xl flex items-center gap-5 transform transition-all duration-300 ease-out translate-x-32 opacity-0 min-w-[320px] max-w-[450px] z-[100]`;

            let titleVal = tags.includes('success') ? 'Success' : (tags.includes('error') ? 'System Alert' : 'Notification');

            toast.innerHTML = `
                <div class="w-12 h-12 rounded-full ${iconColorClass.split(' ').slice(0, 2).join(' ')} flex items-center justify-center shrink-0 border border-current/10">
                    <i class="fa-solid ${iconClass} text-xl"></i>
                </div>
                <div class="flex-1 pr-6 flex flex-col justify-center">
                    <h4 class="font-display font-bold text-gray-900 dark:text-gray-100 text-lg leading-none tracking-wide">${titleVal}</h4>
                    <p class="text-[14px] text-gray-500 dark:text-gray-400 mt-2 leading-snug font-sans">${message}</p>
                </div>
                <button onclick="this.parentElement.remove()" class="absolute top-5 right-5 text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            `;

            container.appendChild(toast);

            requestAnimationFrame(() => toast.classList.remove('translate-x-32', 'opacity-0'));

            setTimeout(() => {
                toast.classList.add('translate-x-32', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const messagesJson = document.getElementById('django-messages');
            if (messagesJson) {
                try {
                    const messages = JSON.parse(messagesJson.textContent);
                    messages.forEach(item => showToast(item.message, item.tags));
                } catch (e) { }
            }
        });
    </script>

    {% if messages %}
    <script id="django-messages" type="application/json">
        [
            {% for message in messages %}
            {"message": "{{ message|escapejs }}", "tags": "{{ message.tags }}"}{% if not forloop.last %},{% endif %}
            {% endfor %}
        ]
    </script>
    {% endif %}

</body>

</html>
