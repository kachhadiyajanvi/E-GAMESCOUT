{% extends 'web/Admin/admin_dashboard.html' %}

{% block content %}
<div class="flex-1 overflow-y-auto p-8 flex justify-center">
    <!-- Admin Org Edit Page - Updated Status Logic -->
    <div
        class="bg-white/5 border border-white/10 rounded-2xl p-8 max-w-2xl w-full backdrop-blur-sm shadow-[0_0_50px_rgba(0,243,255,0.1)] relative">
        <div class="flex items-center justify-between mb-8">
            <h2 class="font-display font-bold text-2xl text-white">ORGANIZATION DETAILS</h2>
            <a href="{% url 'admin_organization_detail' %}"
                class="text-xs font-bold text-white/40 hover:text-white transition-colors uppercase tracking-wider">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back
            </a>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}



            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-white/40 mb-2 uppercase tracking-wider">Organization
                        Name</label>
                    <div
                        class="w-full bg-[#0a0a0a]/50 border border-white/5 rounded-lg px-4 py-3 text-sm text-white/50">
                        <a href="#" class="hover:text-brand-blue transition-colors">{{ org.Organization_Name }}</a>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-white/40 mb-2 uppercase tracking-wider">Username</label>
                    <input type="text" value="{{ org.Organization_UserName }}" readonly
                        class="w-full bg-[#0a0a0a]/50 border border-white/5 rounded-lg px-4 py-3 text-sm text-white cursor-not-allowed outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-white/40 mb-2 uppercase tracking-wider">Email
                        Address</label>
                    <input type="email" value="{{ org.Organization_Email }}" readonly
                        class="w-full bg-[#0a0a0a]/50 border border-white/5 rounded-lg px-4 py-3 text-sm text-white/50 cursor-not-allowed outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-white/40 mb-2 uppercase tracking-wider">Contact
                        Number</label>
                    <input type="text" value="{{ org.Organization_Contact }}" readonly
                        class="w-full bg-[#0a0a0a]/50 border border-white/5 rounded-lg px-4 py-3 text-sm text-white/50 cursor-not-allowed outline-none">
                </div>
                <!-- Status Field -->
                <div>
                    <label class="block text-xs font-bold text-white/40 mb-2 uppercase tracking-wider">Account
                        Status</label>
                    <div class="relative">
                        <select name="status"
                            class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg px-4 py-3 text-sm text-white focus:border-brand-blue focus:ring-1 focus:ring-brand-blue outline-none transition-all appearance-none cursor-pointer">
                            <option value="Active" {% if org.status=="Active" %}selected{% endif %}>Active</option>
                            <option value="Suspended" {% if org.status=="Suspended" %}selected{% endif %}>Suspended
                            </option>
                            <option value="Pending" {% if org.status=="Pending" %}selected{% endif %}>Pending</option>
                        </select>
                        <i
                            class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-white/30 pointer-events-none"></i>
                    </div>
                </div>
            </div>

            <div class="pt-4 flex gap-4">
                <button type="submit"
                    class="flex-1 bg-brand-blue text-black font-bold py-3 rounded-xl hover:shadow-[0_0_20px_rgba(0,243,255,0.4)] transition-all">
                    Update Status
                </button>
                <a href="{% url 'admin_delete_organization' org.id %}"
                    class="flex-1 bg-red-500/10 border border-red-500/20 text-red-500 font-bold py-3 rounded-xl hover:bg-red-500 hover:text-white transition-all text-center flex items-center justify-center">
                    Delete Data
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
