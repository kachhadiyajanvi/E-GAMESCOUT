<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGAME SCOUT | SECURE ADMIN LOGIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-panel {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 243, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 243, 255, 0.05);
        }

        .input-glow:focus-within {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
            border-color: rgba(0, 243, 255, 0.4);
        }

        .bg-grid {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(0, 243, 255, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.06) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 10%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 80%);
        }

        /* Override Browser Autofill Styles */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #050505 inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                    },
                    colors: {
                        'brand-blue': '#00f3ff',     /* Neon Cyan */
                        'brand-dark': '#050505',     /* Pitch Black */
                    }
                }
            }
        }
    </script>
    {% load static %}
</head>

<body class="bg-brand-dark min-h-screen flex items-center justify-center p-4 font-sans relative overflow-hidden">

    <!-- Glowing Cyber Grid Background -->
    <div class="fixed inset-0 z-0 bg-grid pointer-events-none"></div>

    <!-- Soft central cyan glow -->
    <div
        class="fixed top-1/2 left-1/2 w-[700px] h-[700px] bg-brand-blue/5 rounded-full blur-[120px] pointer-events-none -translate-x-1/2 -translate-y-1/2">
    </div>

    <!-- Main Card Container -->
    <div class="relative z-10 w-full max-w-[400px] glass-panel rounded-2xl p-10 flex flex-col items-center">

        <!-- Logo/Header -->
        <div class="w-full flex flex-col items-center justify-center mb-8">
            <div
                class="w-16 h-16 rounded-xl bg-black flex items-center justify-center shadow-[0_0_15px_rgba(0,243,255,0.1)] relative z-10 border border-brand-blue/20 mb-4">
                <img src="{% static 'web/images/logo.png' %}" alt="Logo"
                    class="w-10 h-10 object-contain drop-shadow-[0_0_8px_rgba(0,243,255,0.6)]">
            </div>

            <div class="text-center w-full">
                <h1 class="font-display font-black text-2xl tracking-[0.15em] mb-1">
                    <span class="text-white">EGAME</span><span class="text-brand-blue">SCOUT</span>
                </h1>
                <h2 class="font-display font-medium text-[10px] text-white/50 tracking-[0.4em] uppercase">Administrator
                </h2>
            </div>
        </div>

        <!-- Form -->
        <form method="post" class="space-y-5 w-full relative z-20">
            {% csrf_token %}

            <!-- Email Input -->
            <div class="relative group input-glow rounded-lg transition-all duration-300">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i
                        class="fa-regular fa-envelope text-white/30 group-focus-within:text-brand-blue transition-colors text-sm"></i>
                </div>
                <input type="email" name="email"
                    class="w-full bg-black/60 border border-white/10 rounded-lg pl-11 pr-4 py-3.5 text-white font-semibold focus:outline-none placeholder-transparent peer text-sm tracking-wide"
                    placeholder="Email Address" required>
                <label
                    class="absolute left-11 top-3.5 text-white/40 text-[13px] font-medium transition-all peer-focus:-translate-y-6 peer-focus:-translate-x-8 peer-focus:text-[10px] peer-focus:text-brand-blue peer-focus:tracking-widest peer-focus:bg-brand-dark peer-focus:px-2 peer-focus:rounded peer-[:not(:placeholder-shown)]:-translate-y-6 peer-[:not(:placeholder-shown)]:-translate-x-8 peer-[:not(:placeholder-shown)]:text-[10px] peer-[:not(:placeholder-shown)]:text-gray-400 peer-[:not(:placeholder-shown)]:bg-brand-dark peer-[:not(:placeholder-shown)]:px-2 peer-[:not(:placeholder-shown)]:tracking-widest pointer-events-none uppercase">
                    Email Address
                </label>
            </div>

            <!-- Password Input -->
            <div class="relative group input-glow rounded-lg transition-all duration-300">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i
                        class="fa-solid fa-lock text-white/30 group-focus-within:text-brand-blue transition-colors text-sm"></i>
                </div>
                <input type="password" name="password" id="passwordInput"
                    class="w-full bg-black/60 border border-white/10 rounded-lg pl-11 pr-11 py-3.5 text-white font-semibold focus:outline-none placeholder-transparent peer text-sm tracking-wide"
                    placeholder="Password" required>
                <label
                    class="absolute left-11 top-3.5 text-white/40 text-[13px] font-medium transition-all peer-focus:-translate-y-6 peer-focus:-translate-x-8 peer-focus:text-[10px] peer-focus:text-brand-blue peer-focus:tracking-widest peer-focus:bg-brand-dark peer-focus:px-2 peer-focus:rounded peer-[:not(:placeholder-shown)]:-translate-y-6 peer-[:not(:placeholder-shown)]:-translate-x-8 peer-[:not(:placeholder-shown)]:text-[10px] peer-[:not(:placeholder-shown)]:text-gray-400 peer-[:not(:placeholder-shown)]:bg-brand-dark peer-[:not(:placeholder-shown)]:px-2 peer-[:not(:placeholder-shown)]:tracking-widest pointer-events-none uppercase">
                    Passcode
                </label>
                <button type="button" id="togglePassword"
                    class="absolute inset-y-0 right-0 pr-4 flex items-center text-white/20 hover:text-brand-blue transition-colors focus:outline-none">
                    <i class="fa-solid fa-eye-slash text-sm"></i>
                </button>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full mt-8 relative overflow-hidden rounded-lg bg-brand-blue/10 border border-brand-blue/30 group/btn transition-all duration-300 hover:bg-brand-blue/20 hover:border-brand-blue hover:shadow-[0_0_20px_rgba(0,243,255,0.2)]">
                <div class="py-3.5 px-6 flex items-center justify-center gap-3">
                    <span
                        class="font-display font-semibold uppercase tracking-[0.15em] text-sm text-brand-blue transition-colors">AUTHORIZE</span>
                    <i
                        class="fa-solid fa-arrow-right-to-bracket text-brand-blue text-sm transition-transform group-hover/btn:translate-x-1"></i>
                </div>
            </button>
        </form>

    </div>

    <!-- Toast Notification System -->
    <div id="toast-container" class="fixed top-8 right-8 z-[100] flex flex-col gap-4 pointer-events-none"></div>

    <script>
        // Password Toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passInput = document.getElementById('passwordInput');

        toggleBtn.addEventListener('click', () => {
            const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passInput.setAttribute('type', type);
            const icon = toggleBtn.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });

        // Toast Notifications
        function showToast(message, tags) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let iconClass = 'fa-info-circle';
            let iconColorClass = 'text-brand-blue bg-brand-blue/10 border-brand-blue/30';

            if (tags.includes('error') || tags.includes('warning')) {
                iconClass = 'fa-triangle-exclamation';
                iconColorClass = 'text-red-500 bg-red-500/10 border-red-500/30';
            } else if (tags.includes('success')) {
                iconClass = 'fa-check';
                iconColorClass = 'text-green-400 bg-green-400/10 border-green-400/30';
            }

            toast.className = `pointer-events-auto bg-[#0a0a0a]/95 backdrop-blur-md border rounded-lg p-4 pr-10 shadow-[0_10px_30px_rgba(0,0,0,0.8)] flex items-center gap-4 transform transition-all duration-300 ease-out translate-x-32 opacity-0 min-w-[300px] ${iconColorClass.split(' ')[2]}`;

            toast.innerHTML = `
                <div class="w-8 h-8 rounded bg-black/50 flex items-center justify-center shrink-0 border border-current/20 ${iconColorClass.split(' ').slice(0, 1).join('')}">
                    <i class="fa-solid ${iconClass} text-[10px]"></i>
                </div>
                <div class="flex-1">
                    <p class="text-[13px] text-white/90 font-medium tracking-wide">${message}</p>
                </div>
                <button onclick="this.parentElement.remove()" class="absolute top-1/2 -translate-y-1/2 right-3 text-white/30 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            `;

            container.appendChild(toast);

            requestAnimationFrame(() => toast.classList.remove('translate-x-32', 'opacity-0'));

            setTimeout(() => {
                toast.classList.add('translate-x-32', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const messagesJson = document.getElementById('django-messages');
            if (messagesJson) {
                try {
                    const messages = JSON.parse(messagesJson.textContent);
                    messages.forEach(item => showToast(item.message, item.tags));
                } catch (e) { }
            }
        });
    </script>

    {% if messages %}
    <script id="django-messages" type="application/json">
        [
            {% for message in messages %}
            {"message": "{{ message|escapejs }}", "tags": "{{ message.tags }}"}{% if not forloop.last %},{% endif %}
            {% endfor %}
        ]
    </script>
    {% endif %}

</body>

</html>
