<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | E-Game Scout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Rajdhani', 'sans-serif'], display: ['Orbitron', 'sans-serif'] },
                    colors: { 'brand-dark': '#0B0C10', 'brand-gray': '#1F2833', 'brand-light': '#C5C6C7', 'accent-cyan': '#66FCF1' }
                }
            }
        }
    </script>
</head>

<body class="bg-brand-dark text-white font-sans overflow-hidden h-screen flex items-center justify-center">

    <div class="fixed inset-0 bg-[radial-gradient(circle_at_50%_50%,_#1a2b4b_0%,_#0B0C10_100%)] -z-10"></div>

    <div
        class="w-full max-w-md p-8 bg-brand-gray/20 backdrop-blur-xl border border-white/10 rounded-2xl shadow-[0_0_30px_rgba(102,252,241,0.1)] relative">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-display font-bold text-white mb-2 tracking-wide">VERIFICATION</h2>
            <p class="text-brand-light text-sm">Code sent to <span class="text-accent-cyan">{{ email }}</span></p>
        </div>

        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <div class="p-3 bg-red-500/10 border border-red-500/50 rounded text-red-500 text-sm text-center">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-accent-cyan text-xs font-bold uppercase tracking-widest mb-2">Security
                    Code</label>
                {{ form.otp_code }}
            </div>

            <button type="submit"
                class="w-full py-3 bg-accent-cyan text-brand-dark font-display font-bold uppercase tracking-wider rounded-lg hover:bg-white hover:scale-[1.02] transition-all shadow-[0_0_20px_rgba(102,252,241,0.4)]">
                Verify Identity <i class="fa-solid fa-shield-check ml-2"></i>
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="{% url 'auth_login' %}" class="text-gray-500 text-xs hover:text-white transition-colors">
                Use different email
            </a>
        </div>
    </div>

</body>

</html>
