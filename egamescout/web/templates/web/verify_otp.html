{% extends 'web/player_base.html' %}

{% block content %}
<div class="w-full max-w-md">
    <div
        class="glass-card p-8 rounded-xl border border-white/10 relative overflow-hidden group hover:border-accent-cyan/30 transition-all duration-300">
        <!-- Header -->
        <div class="mb-8 text-center">
            <h2 class="text-3xl font-display font-bold text-white mb-2">SECURITY CHECK</h2>
            <p class="text-brand-light text-sm">Code sent to <span class="text-accent-cyan font-bold">{{ email }}</span>
            </p>
        </div>

        <!-- Form -->
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-accent-cyan text-xs font-bold uppercase tracking-widest mb-2">
                    Enter OTP Code
                </label>
                {{ form.otp_code }}
                {% if form.otp_code.errors %}
                <p class="text-red-500 text-xs mt-1">{{ form.otp_code.errors.0 }}</p>
                {% endif %}
            </div>

            <button type="submit"
                class="w-full py-4 bg-accent-cyan hover:bg-white text-black font-display font-bold uppercase tracking-wider rounded transition-colors group-hover:shadow-[0_0_20px_rgba(102,252,241,0.4)]">
                Verify Identity
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500">
            <a href="{% url 'auth_login' %}" class="text-gray-400 hover:text-white transition-colors">
                Change Email Address
            </a>
        </div>
    </div>
</div>
{% endblock %}
