{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Game Scout | Organization Portal</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'web/images/logo.png' %}">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&amp;family=Rajdhani:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                    },
                    colors: {
                        'brand-dark': '#0B0C10',
                        'brand-gray': '#1F2833',
                        'brand-light': '#C5C6C7',
                        'accent-cyan': '#66FCF1',
                        'neon-pink': '#FF2A6D',
                        'accent-dark-cyan': '#45A29E',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{% static 'web/css/style.css' %}">
</head>

<body
    class="bg-brand-dark text-white font-sans selection:bg-accent-cyan selection:text-brand-dark min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Global Grain Overlay -->
    <div class="fixed inset-0 pointer-events-none opacity-[0.03] z-[100]"
        style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');">
    </div>

    <!-- Grid Background -->
    <div class="fixed inset-0 bg-grid-pattern pointer-events-none -z-20"></div>

    <!-- Navbar (Glassmorphism) -->
    <nav
        class="w-full py-3 sm:py-5 px-4 sm:px-6 md:px-12 flex items-center justify-between gap-2 border-b border-white/[0.08] bg-black/30 backdrop-blur-xl sticky top-0 z-50 shadow-[0_4px_30px_rgba(0,0,0,0.5)] relative">
        <!-- Glassy bottom glow line -->
        <div class="absolute bottom-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-accent-cyan/30 to-transparent"></div>
        <!-- Subtle top highlight -->
        <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>

        <!-- Left: Branding -->
        <div class="flex items-center gap-2 shrink-0">
            <a href="{% url 'index' %}" class="flex items-center gap-2 group shrink-0">
                <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-lg bg-accent-cyan/10 border border-accent-cyan/20 flex items-center justify-center group-hover:border-accent-cyan/50 group-hover:shadow-[0_0_15px_rgba(102,252,241,0.3)] transition-all duration-300">
                    <img src="{% static 'web/images/logo.png' %}" alt="Logo"
                        class="w-5 h-5 sm:w-6 sm:h-6 object-contain group-hover:drop-shadow-[0_0_8px_rgba(102,252,241,0.8)] transition-all">
                </div>
                <span
                    class="text-base sm:text-lg font-display font-bold tracking-wider truncate text-white transition-colors duration-300">EGAME<span class="text-transparent bg-clip-text bg-gradient-to-r from-accent-cyan to-neon-pink drop-shadow-[0_0_8px_rgba(102,252,241,0.5)]">SCOUT</span></span>
            </a>
        </div>
        
        <!-- Right: Actions -->
        <div class="ml-auto flex items-center gap-1 sm:gap-2 justify-end shrink-0">
            <a href="{% url 'index' %}"
                class="hidden sm:inline-block text-xs sm:text-sm font-bold text-gray-400 hover:text-white px-2 sm:px-3 py-2 rounded-lg hover:bg-white/5 transition-all duration-300">HOME</a>
            <a href="{% url 'org_login_start' %}"
                class="text-xs sm:text-sm font-bold px-2 sm:px-3 py-1.5 sm:py-2 rounded-lg transition-all duration-300 {% if 'login' in request.path %}text-white bg-white/5{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">LOGIN</a>
            <a href="{% url 'org_register_start' %}"
                class="px-3 sm:px-5 py-2 sm:py-2.5 border font-bold text-[10px] sm:text-xs rounded-lg transition-all duration-300 whitespace-nowrap {% if 'register' in request.path %}bg-accent-cyan text-black border-accent-cyan shadow-[0_0_20px_rgba(102,252,241,0.3)]{% else %}text-accent-cyan border-accent-cyan/40 hover:bg-accent-cyan hover:text-black hover:shadow-[0_0_20px_rgba(102,252,241,0.3)]{% endif %}">REGISTER</a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 md:p-8 relative z-10">

        <!-- Decoration Orbs -->
        <div
            class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-[100px] -z-10 animate-pulse-slow">
        </div>
        <div
            class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-accent-cyan/5 rounded-full blur-[80px] -z-10 animate-float">
        </div>

        {% block content %}{% endblock %}
    </main>

    <footer class="py-6 flex flex-col items-center gap-2 border-t border-white/5">
        <div class="text-gray-600 text-xs">&copy; 2026 E-Game Scout Organization Portal.</div>
        <div class="flex items-center gap-4 mt-1 mb-1">
            <a href="{% url 'terms' %}" class="text-xs text-gray-400 hover:text-accent-cyan transition-colors">Terms & Conditions</a>
        </div>
        <a href="mailto:help.egamescout@gmail.com"
            class="text-gray-400 hover:text-accent-cyan transition-colors text-sm flex items-center gap-2">
            <i class="fa-solid fa-envelope"></i> help.egamescout@gmail.com
        </a>
    </footer>

    <!-- Toast Notification Container -->
    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-20 left-2 right-2 sm:left-auto sm:right-8 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    {% if messages %}
    <script id="django-messages" type="application/json">
        [
            {% for message in messages %}
            {
                "message": "{{ message|escapejs }}",
                "tags": "{{ message.tags|escapejs }}"
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
        ]
    </script>
    {% endif %}

    <script>
        function showToast(message, tags) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            // Style based on tags
            let iconClass = 'fa-info-circle';
            let iconColorClass = 'text-blue-500 bg-blue-500/10';
            let title = 'Notification';

            if (tags.includes('success')) {
                iconClass = 'fa-check';
                iconColorClass = 'text-green-500 bg-green-500/10';
                title = 'Success';
            } else if (tags.includes('error') || tags.includes('warning')) {
                iconClass = 'fa-triangle-exclamation';
                iconColorClass = 'text-red-500 bg-red-500/10';
                title = 'System Alert';
            }

            toast.className = `
                pointer-events-auto
                bg-[#0a0a0a] border border-white/10 
                rounded-xl p-4 pr-12
                shadow-[0_8px_30px_rgb(0,0,0,0.5)]
                flex items-center gap-4
                transform transition-all duration-500 ease-out translate-x-20 opacity-0
                w-full sm:w-auto sm:min-w-[300px] max-w-full sm:max-w-md
            `;

            toast.innerHTML = `
                <div class="w-10 h-10 rounded-full ${iconColorClass} flex items-center justify-center shrink-0">
                    <i class="fa-solid ${iconClass} text-lg"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-bold text-white text-sm font-display tracking-wide">${title}</h4>
                    <p class="text-xs text-gray-400 mt-0.5">${message}</p>
                </div>
                <button onclick="this.parentElement.remove()" 
                    class="absolute top-4 right-4 text-white/20 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;

            container.appendChild(toast);

            // Animate In
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-20', 'opacity-0');
            });

            // Auto Dismiss
            setTimeout(() => {
                toast.classList.add('translate-x-20', 'opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 5000);
        }

        // Initialize Django Messages
        document.addEventListener('DOMContentLoaded', () => {
            const messagesJson = document.getElementById('django-messages');
            if (messagesJson) {
                try {
                    const messages = JSON.parse(messagesJson.textContent);
                    messages.forEach(item => {
                        showToast(item.message, item.tags);
                    });
                } catch (e) {
                    console.error('Error parsing messages:', e);
                }
            }
        });
    </script>

</body>

</html>
