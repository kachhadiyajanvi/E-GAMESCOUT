{% extends 'web/Organization/dashboard_base.html' %}
{% load static %}

{% block content %}
<div class="container mx-auto max-w-lg min-h-[60vh] flex flex-col justify-center">
    <!-- Breadcrumb -->
    <nav class="page-breadcrumb absolute top-24 left-8">
        <a href="{% url 'organizer_dashboard' %}" class="breadcrumb-link">
            <i class="fa-solid fa-home text-xs"></i>
            <span>Home</span>
        </a>
        <i class="fa-solid fa-chevron-right breadcrumb-separator"></i>
        <span class="breadcrumb-active">Delete Account</span>
    </nav>
    <div
        class="bg-[#0B0C10] border border-red-500/20 rounded-3xl p-8 relative overflow-hidden shadow-[0_0_50px_rgba(239,68,68,0.1)]">
        <!-- Background Glow -->
        <div class="absolute top-0 right-0 w-64 h-64 bg-red-500/5 rounded-full blur-3xl -z-10 pointer-events-none">
        </div>

        <div class="text-center mb-8">
            <div
                class="w-16 h-16 rounded-full bg-red-500/10 border border-red-500/20 flex items-center justify-center mx-auto mb-6 shadow-[0_0_20px_rgba(239,68,68,0.2)]">
                <i class="fa-solid fa-triangle-exclamation text-2xl text-red-500"></i>
            </div>
            <h1 class="text-2xl font-display font-bold text-white mb-2">Delete Organization?</h1>
            <p class="text-gray-400 text-sm">This action is permanent. All tournaments, players, and data associated
                with this organization will be permanently erased.</p>
        </div>

        <div class="flex flex-col gap-4">
            <form method="POST" class="w-full">
                {% csrf_token %}
                <button type="submit"
                    class="w-full py-3.5 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow-[0_0_20px_rgba(239,68,68,0.3)] hover:shadow-[0_0_30px_rgba(239,68,68,0.5)] transition-all flex items-center justify-center gap-2 uppercase tracking-wider text-sm">
                    <i class="fa-solid fa-trash-can"></i> Confirm Deletion
                </button>
            </form>

            <a href="{% url 'manage_profile' %}"
                class="w-full py-3.5 bg-white/5 hover:bg-white/10 text-white font-bold rounded-xl border border-white/10 transition-all flex items-center justify-center gap-2 uppercase tracking-wider text-sm">
                Cancel
            </a>
        </div>
    </div>
</div>
{% endblock %}
