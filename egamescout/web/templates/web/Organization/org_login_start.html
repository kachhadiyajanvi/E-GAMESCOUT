{% extends 'web/Organization/org_base.html' %}

{% block content %}
<div class="w-full max-w-md">
    <div
        class="glass-card p-8 rounded-xl border border-white/10 relative overflow-hidden group hover:border-accent-cyan/30 transition-all duration-300">
        <!-- Header -->
        <div class="mb-8 text-center">
            <h2 class="text-3xl font-display font-bold text-white mb-2">ORG ACCESS</h2>
            <p class="text-gray-400 text-sm">Login to your dashboard</p>
        </div>

        <!-- Form -->
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-accent-cyan text-xs font-bold uppercase tracking-widest mb-2">
                    Registered Email
                </label>
                {{ form.organization_email }}
                {% if form.organization_email.errors %}
                <p class="text-red-500 text-xs mt-1">{{ form.organization_email.errors.0 }}</p>
                {% endif %}
            </div>

            <button type="submit"
                class="w-full py-4 bg-accent-cyan hover:bg-white text-black font-display font-bold uppercase tracking-wider rounded transition-colors group-hover:shadow-[0_0_20px_rgba(102,252,241,0.4)]">
                Send OTP
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500">
            New Organization? <a href="{% url 'org_register_start' %}" class="text-accent-cyan hover:underline">Apply
                Here</a>
        </div>
    </div>
</div>
{% endblock %}
